<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横浜営業所 通知モニター</title>
<meta name="theme-color" content="#0f7548">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Yu Gothic",
      Meiryo,
      sans-serif;
    background: #eef2f0;
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: min(560px, 100%);
    background: #ffffff;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 12px 34px rgba(0,0,0,.10);
    text-align: center;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 26px;
  }

  .status {
    margin-top: 18px;
    padding: 18px;
    border-radius: 14px;
    background: #f7faf8;
    border: 1px solid #dce5e0;
    line-height: 1.6;
    font-weight: 700;
  }

  .ok {
    color: #0f7548;
  }

  .warn {
    color: #b45309;
  }

  .err {
    color: #b91c1c;
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    min-height: 54px;
    margin-top: 14px;
    padding: 14px 18px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }

  .primary {
    background: #0f7548;
    color: #ffffff;
  }

  .secondary {
    background: #eef2f0;
    color: #1f2937;
    border: 1px solid #cdd8d2;
  }

  .small {
    margin-top: 16px;
    font-size: 13px;
    color: #667085;
    line-height: 1.6;
  }

  #permissionArea,
  #blockedArea {
    display: none;
  }

  #lastCheck {
    margin-top: 12px;
    font-size: 14px;
    color: #475569;
  }
</style>
</head>

<body>
<div class="card">
  <h1>横浜営業所 通知モニター</h1>

  <div id="readyArea" style="display:none;">
    <div class="status ok">
      Windows通知：ON<br>
      通知を監視しています。
      <div id="lastCheck">接続確認中…</div>
    </div>

    <button id="openViewerButton" class="primary">
      納品実績を開く
    </button>

    <div class="small">
      この通知モニターのタブは閉じずに、そのまま残してください。
    </div>
  </div>

  <div id="permissionArea">
    <div class="status warn">
      初回のみWindows通知の許可が必要です。
    </div>

    <button id="enableButton" class="primary">
      通知を有効にして納品実績を開く
    </button>
  </div>

  <div id="blockedArea">
    <div class="status err">
      Windows通知がブロックされています。<br>
      Edgeのサイト設定で通知を「許可」にしてください。
    </div>

    <button id="openViewerWithoutNotification" class="secondary">
      通知なしで納品実績を開く
    </button>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQ81_BAcdPaeBqWhqqcQchRWUXlLzy2FztJmYTTkCudGQjMDRqhSLSN0BwMjsgA068/exec';
const VIEWER_URL = 'https://script.google.com/macros/s/AKfycbwQ81_BAcdPaeBqWhqqcQchRWUXlLzy2FztJmYTTkCudGQjMDRqhSLSN0BwMjsgA068/exec?page=viewer';
const POLL_MS = 15000;

let initialized = false;
let polling = false;
let knownOperationKeys = new Set();
let knownReportKeys = new Set();
let knownCompletionKeys = new Set();
let pollTimer = null;
let viewerOpenedThisSession = false;

const readyArea = document.getElementById('readyArea');
const permissionArea = document.getElementById('permissionArea');
const blockedArea = document.getElementById('blockedArea');
const enableButton = document.getElementById('enableButton');
const openViewerButton = document.getElementById('openViewerButton');
const openViewerWithoutNotification =
  document.getElementById('openViewerWithoutNotification');
const lastCheck = document.getElementById('lastCheck');

function showArea(name) {
  readyArea.style.display = name === 'ready' ? 'block' : 'none';
  permissionArea.style.display = name === 'permission' ? 'block' : 'none';
  blockedArea.style.display = name === 'blocked' ? 'block' : 'none';
}

function openViewer() {
  /*
   * 通知モニターはこのタブに残し、
   * 納品実績は別タブで開く。
   * 監視タブを閉じるとWindows通知も止まるため。
   */
  const w = window.open(
    VIEWER_URL,
    'mori_delivery_viewer'
  );

  if (w) {
    try {
      w.focus();
    } catch (e) {}
    viewerOpenedThisSession = true;
    return true;
  }

  return false;
}

function showWindowsNotification(title, body, tag) {
  if (
    !('Notification' in window) ||
    Notification.permission !== 'granted'
  ) {
    return;
  }

  try {
    const n = new Notification(
      title,
      {
        body: body || '',
        tag: tag || ('mori-' + Date.now()),
        renotify: true,
        silent: false
      }
    );

    n.onclick = function() {
      try { window.focus(); } catch (e) {}
      try { n.close(); } catch (e) {}
    };
  } catch (e) {
    console.error(e);
  }
}

function notifyOperation(item) {
  const body = [
    [item.routeName, item.driver].filter(Boolean).join('　'),
    item.time ? '時刻　' + item.time : ''
  ].filter(Boolean).join('\n');

  showWindowsNotification(
    '納品実績｜出発',
    body || '運行を開始しました',
    item.key
  );
}

function notifyReport(item) {
  const body = [
    [item.routeName, item.driver].filter(Boolean).join('　'),
    [item.customer, item.destination].filter(Boolean).join(' ／ '),
    [
      item.time ? '時刻　' + item.time : '',
      item.reportId ? '報告ID　' + item.reportId : ''
    ].filter(Boolean).join('　')
  ].filter(Boolean).join('\n');

  showWindowsNotification(
    '納品実績｜新着納品報告',
    body || '新しい納品報告を受信しました',
    item.key
  );
}

function notifyCompletion(item) {
  const body = [
    [item.routeName, item.driver].filter(Boolean).join('　'),
    item.time ? '終了時刻　' + item.time : ''
  ].filter(Boolean).join('\n');

  showWindowsNotification(
    '納品実績｜' + (item.completionLabel || '運行終了'),
    body || '運行を終了しました',
    item.key
  );
}

window.moriNotificationCallback = function(data) {
  polling = false;

  const operations =
    Array.isArray(data && data.operations)
      ? data.operations
      : [];

  const reports =
    Array.isArray(data && data.reports)
      ? data.reports
      : [];

  const completions =
    Array.isArray(data && data.completions)
      ? data.completions
      : [];

  const nextOperationKeys =
    new Set(
      operations.map(
        x => String(x.key || '')
      )
    );

  const nextReportKeys =
    new Set(
      reports.map(
        x => String(x.key || '')
      )
    );

  const nextCompletionKeys =
    new Set(
      completions.map(
        x => String(x.key || '')
      )
    );

  if (!initialized) {
    knownOperationKeys = nextOperationKeys;
    knownReportKeys = nextReportKeys;
    knownCompletionKeys = nextCompletionKeys;
    initialized = true;
  } else {
    operations
      .slice()
      .sort(
        (a, b) =>
          Number(a.timestamp || 0) -
          Number(b.timestamp || 0)
      )
      .forEach(item => {
        const key =
          String(item.key || '');

        if (
          key &&
          !knownOperationKeys.has(key)
        ) {
          notifyOperation(item);
        }
      });

    reports
      .slice()
      .sort(
        (a, b) =>
          Number(a.timestamp || 0) -
          Number(b.timestamp || 0)
      )
      .forEach(item => {
        const key =
          String(item.key || '');

        if (
          key &&
          !knownReportKeys.has(key)
        ) {
          notifyReport(item);
        }
      });

    completions
      .slice()
      .sort(
        (a, b) =>
          Number(a.updatedAt || 0) -
          Number(b.updatedAt || 0)
      )
      .forEach(item => {
        const key =
          String(item.key || '');

        if (
          key &&
          !knownCompletionKeys.has(key)
        ) {
          notifyCompletion(item);
        }
      });

    knownOperationKeys = nextOperationKeys;
    knownReportKeys = nextReportKeys;
    knownCompletionKeys = nextCompletionKeys;
  }

  const now = new Date();

  lastCheck.textContent =
    '最終確認：' +
    now.toLocaleTimeString(
      'ja-JP',
      {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }
    ) +
    '　監視中';
};

function poll() {
  if (polling) return;

  polling = true;

  const script =
    document.createElement('script');

  script.src =
    GAS_URL +
    '?api=notificationState' +
    '&callback=moriNotificationCallback' +
    '&t=' +
    Date.now();

  script.async = true;

  script.onerror = function() {
    polling = false;

    if (lastCheck) {
      lastCheck.textContent =
        '接続エラー：' +
        new Date().toLocaleTimeString('ja-JP');
    }

    try {
      script.remove();
    } catch (e) {}
  };

  script.onload = function() {
    try {
      script.remove();
    } catch (e) {}
  };

  document.head.appendChild(
    script
  );

  window.setTimeout(
    function() {
      if (polling) {
        polling = false;
      }
    },
    12000
  );
}

function startPolling() {
  if (pollTimer) {
    clearInterval(
      pollTimer
    );
  }

  poll();

  pollTimer =
    setInterval(
      poll,
      POLL_MS
    );
}

async function enableNotificationsAndOpenViewer() {
  /*
   * ポップアップブロックを避けるため、
   * クリック直後に先にViewerタブを作っておく。
   */
  const viewerWindow =
    window.open(
      'about:blank',
      'mori_delivery_viewer'
    );

  try {
    const permission =
      await Notification.requestPermission();

    if (permission === 'granted') {
      showArea('ready');
      startPolling();

      if (viewerWindow) {
        viewerWindow.location.href =
          VIEWER_URL;

        try {
          viewerWindow.focus();
        } catch (e) {}

        viewerOpenedThisSession = true;
      } else {
        openViewer();
      }

      showWindowsNotification(
        '納品実績｜通知モニター',
        'Windows通知を有効にしました。'
      );

      return;
    }

    if (viewerWindow) {
      try {
        viewerWindow.close();
      } catch (e) {}
    }

    if (permission === 'denied') {
      showArea('blocked');
    } else {
      showArea('permission');
    }
  } catch (e) {
    if (viewerWindow) {
      try {
        viewerWindow.close();
      } catch (error) {}
    }

    showArea('permission');
  }
}

function initialize() {
  if (!('Notification' in window)) {
    showArea('blocked');
    return;
  }

  if (Notification.permission === 'granted') {
    showArea('ready');
    startPolling();

    /*
     * 既に通知許可済みの場合は、
     * 納品実績を自動で別タブに開く。
     * Edge側で自動ポップアップを止められた場合は
     * 「納品実績を開く」ボタンだけ残る。
     */
    window.setTimeout(
      function() {
        if (!viewerOpenedThisSession) {
          openViewer();
        }
      },
      300
    );

    return;
  }

  if (Notification.permission === 'denied') {
    showArea('blocked');
    return;
  }

  showArea('permission');
}

enableButton.addEventListener(
  'click',
  enableNotificationsAndOpenViewer
);

openViewerButton.addEventListener(
  'click',
  openViewer
);

openViewerWithoutNotification.addEventListener(
  'click',
  openViewer
);

window.addEventListener(
  'focus',
  function() {
    if (
      Notification.permission === 'granted'
    ) {
      poll();
    }
  }
);

document.addEventListener(
  'visibilitychange',
  function() {
    if (
      !document.hidden &&
      Notification.permission === 'granted'
    ) {
      poll();
    }
  }
);

initialize();
</script>
</body>
</html>
